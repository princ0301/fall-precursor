[project]
name = "fall-precursor"
version = "0.1.0"
description = "Skeleton-based fall precursor detection"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "torch>=2.3",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "mediapipe>=0.10",
    "opencv-python>=4.9",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fallprecursor"]
